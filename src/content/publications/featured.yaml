featured:
  - pmid: "38128532"
    title: >
      Multi-modal cell-free DNA genomic and fragmentomic patterns enhance cancer
      survival and recurrence analysis
    venue: Cell Reports Medicine
    year: 2024
    problem: >
      Tumor-derived cfDNA is cleaved differently from healthy DNA, but shallow WGS
      needs robust end-sequence metrics to turn that biology into a detection signal.
    method: >
      Snakemake pipeline extracting fragment-end sequence proportions and diversity,
      integrating copy-number aberration, fragment size, and end-sequence features
      into a FrEIA score with machine-learning classification for cancer detection.
    impact: >
      Open-source toolkit used in multi-modal cfDNA genomic and fragmentomic analyses
      for cancer survival and recurrence.
    tags:
      - cfDNA
      - fragmentomics
      - Snakemake
      - Python
      - liquid biopsy
    doi: https://doi.org/10.1016/j.xcrm.2023.101349
    pubmed: https://pubmed.ncbi.nlm.nih.gov/38128532/
    code: https://github.com/mouliere-lab/FrEIA
  - pmid: "37942753"
    title: >
      Real-time analysis of the cancer genome and fragmentome from plasma and
      urine cell-free DNA using nanopore sequencing
    venue: EMBO Molecular Medicine
    year: 2023
    problem: >
      Long (>500 bp) cell-free DNA fragments from nanopore sequencing challenge
      assumptions about tumor-derived fragment length in liquid biopsy.
    method: >
      End-to-end bioinformatics pipeline for real-time analysis of the cancer genome
      and fragmentome from plasma and urine cfDNA using Oxford Nanopore and Illumina
      sequencing data.
    impact: >
      Pipeline and study published in EMBO Molecular Medicine,
      demonstrating long-read fragmentomics for liquid biopsy.
    tags:
      - cfDNA
      - nanopore
      - Illumina
      - fragmentomics
      - pipeline
    doi: https://doi.org/10.15252/emmm.202217282
    pubmed: https://pubmed.ncbi.nlm.nih.gov/37942753/
    code: https://github.com/mouliere-lab/ITSFASTR
  - pmid: "29872099"
    title: >
      Third-generation Sequencing Reveals Extensive Polycistronism and Transcriptional
      Overlapping in a Baculovirus
    venue: Scientific Reports
    year: 2018
    problem: >
      Short-read assays under-resolve overlapping and polycistronic transcription in
      compact viral genomes, obscuring true transcript architecture.
    method: >
      PacBio long-read sequencing of Autographa californica multiple nucleopolyhedrovirus
      RNA to map full-length isoforms, polycistronic RNAs, and transcriptional overlaps.
    impact: >
      First-author Scientific Reports study establishing long-read
      isoform mapping for a prototype baculovirus transcriptome.
    tags:
      - long-read
      - RNA-seq
      - baculovirus
      - PacBio
      - transcriptomics
    doi: https://doi.org/10.1038/s41598-018-26955-8
    pubmed: https://pubmed.ncbi.nlm.nih.gov/29872099/
