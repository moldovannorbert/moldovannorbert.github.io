pillars:
  - title: ML for multi-omics data
    items:
      - Deep learning and predictive models (PyTorch, scikit-learn)
      - Embeddings, transformers, and diffusion models
      - High-dimensional unstructured genomic and transcriptomic data
  - title: Liquid biopsy and biomarkers
    items:
      - cfDNA genomics, epigenomics, and fragmentomics for cancer detection and MRD
      - Short- and long-read sequencing (Illumina, Oxford Nanopore, PacBio)
      - DNA and RNA workflows including circRNA from liquid biopsies
  - title: Pipelines and HPC
    items:
      - Python, R, and Bash for production bioinformatics tooling
      - Snakemake and Mamba/Conda for scalable, reproducible pipelines
      - Slurm HPC workflows, multi-threading and GPU acceleration
